kind: DataPowerAssembly
apiVersion: api.ibm.com/v1
metadata:
  name: assembly-echo-api
  namespace: DPv5c_Product_Order-3
  version: 1.0.1
  tags: []
spec:
  x-ibm-configuration:
    assembly:
      execute:
        - operation-switch:
            title: operation-switch
            case:
              - operations:
                  - verb: get
                    path: /get
                execute:
                  - map:
                      title: map
                      inputs:
                        inputText:
                          schema:
                            type: string
                          variable: request.parameters.text
                      outputs:
                        output:
                          schema:
                            $ref: '#/definitions/responseObject'
                          variable: message.body
                          content: application/json
                      actions:
                        - set: output.text
                          from: inputText
    gateway: datapower-gateway
    enforced: true
    testable: true
    phase: realized
    cors:
      enabled: true
